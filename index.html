<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- so "add to home screen" opens this as a standalone app, no safari bars,
       status bar floating over the black background -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="APOD">
  <meta name="theme-color" content="#000">
  <title>APOD</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
      font: 15px/1.5 system-ui, sans-serif;
      color: #eee;
    }

    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
      /* vh = big viewport that hides under the phone browser bars, dvh = what
         you can actually see. browsers that don't know dvh keep the vh fallback */
      height: 100vh;
      height: 100dvh;
    }

    #pic {
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }

    /* while the full res is still coming down, stretch the tiny preview into
       its spot and blur it a bit. no transform/scale here: the preview keeps
       the exact crop of the real file so swapping in can't move anything */
    #pic.preview {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      filter: blur(5px);
    }

    .hidden {
      display: none !important;
      /* ids in the rules below outweigh this class without the !important */
    }

    #status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
    }

    .arrow {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 18vw;
      max-width: 160px;
      border: 0;
      background: none;
      cursor: pointer;
      z-index: 5;
      color: rgba(255, 255, 255, .25);
      font-size: 9vh;
      line-height: 1;
      display: flex;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .arrow:hover {
      color: #fff;
    }

    #prev {
      left: 0;
      padding-left: 1.5vw;
    }

    #next {
      right: 0;
      justify-content: flex-end;
      padding-right: 1.5vw;
    }

    #bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 4;
      padding: 14px calc(18px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
      background: linear-gradient(transparent, rgba(0, 0, 0, .85) 60%);
      transition: opacity .35s;
    }

    #bar h1 {
      margin: 0;
      font-size: 17px;
    }

    #meta {
      margin-top: 2px;
      font-size: 12.5px;
      color: #aaa;
    }

    #meta a {
      color: #9cf;
      text-decoration: none;
    }

    #videolink {
      color: #ffb;
    }

    /* explanation slides in from the right */
    #panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 6;
      width: min(46rem, 86vw);
      overflow-y: auto;
      background: rgba(10, 10, 12, .93);
      padding: calc(22px + env(safe-area-inset-top)) calc(26px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) 26px;
      transform: translateX(100%);
      transition: transform .25s ease;
    }

    #panel.open {
      transform: none;
    }

    #panel h2 {
      margin: 0 0 2px;
    }

    #panel .sub {
      color: #999;
      font-size: 12.5px;
      margin-bottom: 16px;
    }

    #panel .body {
      color: #ddd;
    }

    #panel a {
      color: #9cf;
    }

    #panel .close {
      position: sticky;
      top: 0;
      float: right;
      border: 0;
      background: rgba(255, 255, 255, .08);
      color: #ccc;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }

    body.no-chrome .arrow,
    body.no-chrome #bar {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="stage"><img id="pic" class="hidden" alt=""></div>
  <div id="status">loading...</div>

  <button class="arrow" id="prev" aria-label="previous day">&lsaquo;</button>
  <button class="arrow" id="next" aria-label="next day">&rsaquo;</button>

  <div id="bar">
    <h1 id="title"></h1>
    <div id="meta">
      <span id="date"></span> &middot; <span id="credit"></span>
      <span id="hint">&middot; <a href="#" onclick="return false">&larr;/&rarr; days, i info, h hide, f
          fullscreen</a></span>
    </div>
  </div>

  <aside id="panel">
    <button class="close" id="panelclose">&times;</button>
    <h2 id="ptitle"></h2>
    <div class="sub" id="psub"></div>
    <div class="body" id="pbody"></div>
  </aside>

  <script>
    var API = 'https://science.nasa.gov/wp-json/wp/v2/apod-basic/';

    function $(id) { return document.getElementById(id); }

    function shiftDate(iso, days) {
      // noon UTC so month math can't trip over timezones
      var d = new Date(iso + 'T12:00:00Z');
      d.setUTCDate(d.getUTCDate() + days);
      return d.toISOString().slice(0, 10);
    }
    function yymmdd(iso) {
      return iso.slice(2, 4) + iso.slice(5, 7) + iso.slice(8, 10);
    }
    function today() {
      return new Date().toISOString().slice(0, 10);
    }
    function prettyDate(iso) {
      var d = new Date(iso + 'T12:00:00Z');
      return d.toLocaleDateString(undefined, {
        weekday: 'short', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC'
      });
    }

    // the image host resizes for free. the full urls are cropped to w/h with
    // fit=clip, so the preview has to scale BOTH numbers to stay the same
    // shape; urls without a w param (some 90s stuff) get no preview.
    function thumbUrl(u) {
      if (u.indexOf('?') < 0) return null;
      var w = /[?&]w=(\d+)/.exec(u);
      if (!w) return null;
      var out = u.replace(/([?&])w=\d+/, '$1w=80');
      var h = /[?&]h=(\d+)/.exec(u);
      if (h) out = out.replace(/([?&])h=\d+/, '$1h=' + Math.round(h[1] * 80 / w[1]));
      return out;
    }

    // the explanation and credit fields come back as html from nasa. we only
    // strip anything that could run or reflow the page, nothing fancy.
    function cleanHTML(html) {
      var t = document.createElement('template');
      t.innerHTML = html || '';
      var bad = t.content.querySelectorAll('script,style,iframe,object,embed,form,link,meta');
      for (var i = 0; i < bad.length; i++) bad[i].remove();
      var all = t.content.querySelectorAll('*');
      for (var i = 0; i < all.length; i++) {
        var attrs = all[i].attributes;
        for (var j = attrs.length - 1; j >= 0; j--) {
          var name = attrs[j].name, val = attrs[j].value;
          if (/^on/i.test(name)) all[i].removeAttribute(name);
          if (name == 'href' && /^\s*javascript:/i.test(val)) all[i].removeAttribute(name);
        }
      }
      var links = t.content.querySelectorAll('a[href]');
      for (var i = 0; i < links.length; i++) {
        links[i].target = '_blank';
        links[i].rel = 'noopener';
      }
      return t.content;
    }

    var cur = null; // date we're showing
    var renderId = 0; // bumps per show(), so late callbacks can tell they're stale

    // remember the Image objects we load. the browser drops memory-cache
    // entries whose only reference was a garbage-collected Image(), and
    // then our "is this already downloaded" probe lies about visited days.
    var imgCache = {};
    function remember(url) {
      if (!url) return null;
      if (!imgCache[url]) {
        var im = new Image();
        im.src = url;
        imgCache[url] = im;
        var keys = Object.keys(imgCache);
        if (keys.length > 40) {  // keep it from growing unbounded, drop oldest
          for (var i = 0; i < keys.length; i++) {
            if (keys[i] !== url) { delete imgCache[keys[i]]; break; }
          }
        }
      }
      return imgCache[url];
    }

    // fetch one day. null means "no entry or can't reach nasa"
    async function getDay(iso) {
      var key = 'apod:' + iso;
      try {
        var hit = localStorage.getItem(key);
        if (hit) return JSON.parse(hit);
      } catch (e) { }
      var res;
      try {
        res = await fetch(API + yymmdd(iso));
      } catch (e) {
        return null;
      }
      if (!res.ok) return null;  // bad or missing dates come back 400/404
      var j = await res.json();
      if (Array.isArray(j)) j = j[0];
      if (!j || !j.hdurl) return null;
      try {
        localStorage.setItem(key, JSON.stringify(j));  // past apods don't change, cache forever
      } catch (e) { }
      return j;
    }

    async function show(iso, dir) {
      var d = iso, entry = null, tries = 0;
      // apod occasionally skips a day (or you landed on a 404-ish date), keep walking
      while (tries++ < 400) {
        entry = await getDay(d);
        if (entry) break;
        d = shiftDate(d, dir);
      }
      if (!entry) {
        $('status').textContent = 'Nothing found near ' + iso + '. Network down?';
        return;
      }

      cur = d;
      if (location.hash.slice(1) != d) location.hash = d;

      var old = $('videolink');
      if (old) old.parentNode.removeChild(old);

      var pic = $('pic');
      var full = entry.hdurl;
      var thumb = thumbUrl(full);
      var me = ++renderId;

      // a remembered Image doubles as the downloader and the "do we already
      // have this" probe; complete right now = yes
      var probe = remember(full);
      var cached = probe.complete && probe.naturalWidth > 0;

      if (cached || !thumb) {
        // already on the device: show it sharp, no blur step at all
        pic.classList.remove('preview');
        pic.src = full;
      } else {
        // cold: tiny same-crop preview now, real file when it's ready
        pic.classList.add('preview');
        pic.src = thumb;
        var swap = function () {
          if (me !== renderId) return; // user swiped onward, this render is stale
          pic.classList.remove('preview');
          pic.src = full;
        };
        probe.onload = function () {
          if (probe.decode) {
            // decode first so we never paint a half-decoded jpeg, but this
            // promise has been seen to stall on some engines, so never
            // wait more than 1.5s on it - swap regardless
            Promise.race([
              probe.decode().catch(function () { }),
              new Promise(function (r) { setTimeout(r, 1500); })
            ]).then(swap);
          } else swap();
        };
        probe.onerror = function () { /* nothing better is coming, keep the preview */ };
      }

      pic.alt = entry.title || 'Astronomy Picture of the Day';
      pic.classList.remove('hidden');
      $('status').classList.add('hidden');

      $('title').textContent = entry.title || '';
      $('date').textContent = prettyDate(d);
      var credit = $('credit');
      credit.replaceChildren.apply(credit, cleanHTML(entry.credit || entry.copyright || '').childNodes);

      if ((entry.media_type || 'image') != 'image' && entry.permalink) {
        // the new api only gives us a poster image for videos, no embed url.
        // good enough, just link out.
        var a = document.createElement('a');
        a.id = 'videolink';
        a.href = entry.permalink;
        a.target = '_blank';
        a.textContent = '▶ video, watch on nasa';
        credit.parentNode.insertBefore(a, credit);
        credit.parentNode.insertBefore(document.createTextNode(' · '), a.nextSibling);
      }

      document.title = (entry.title || 'APOD') + ' - ' + d;

      var body = $('pbody');
      body.replaceChildren.apply(body, cleanHTML(entry.explanation || '').childNodes);
      $('ptitle').textContent = entry.title || '';
      $('psub').textContent = prettyDate(d);

      // warm both sides: json, then the image bytes too once we know the url,
      // so a swipe that keeps going lands on an already-downloaded picture
      [-1, 1].forEach(function (off) {
        getDay(shiftDate(d, off)).then(function (nb) {
          if (nb) remember(nb.hdurl);
        }).catch(function () { });
      });
    }

    function step(n) {
      if (!cur) return;
      show(shiftDate(cur, n), n > 0 ? 1 : -1);
    }

    $('prev').onclick = function () { step(-1); };
    $('next').onclick = function () { step(1); };
    $('panelclose').onclick = function () { $('panel').classList.remove('open'); };

    var isTouch = matchMedia('(hover: none)').matches;
    if (isTouch) {
      $('hint').innerHTML = '&middot; <a href="#" onclick="return false">swipe: days &middot; hold: info &middot; tap: hide</a>';
    } else {
      // on desktop a click on the picture now means the same as "h"
      $('pic').onclick = function () { document.body.classList.toggle('no-chrome'); };
    }

    // phone gestures: swipe left/right to flip days, hold for the explanation,
    // a plain tap hides or shows the overlay.
    var stage = $('stage');
    var touch = null, holdTimer = null;

    stage.addEventListener('touchstart', function (e) {
      if (e.touches.length > 1) { touch = null; return; }
      var t = e.touches[0];
      touch = { x: t.clientX, y: t.clientY, ms: Date.now() };
      holdTimer = setTimeout(function () {
        touch = null;
        $('panel').classList.toggle('open');
        if (navigator.vibrate) navigator.vibrate(30);
      }, 500);
    });

    stage.addEventListener('touchmove', function (e) {
      if (!touch) return;
      var dx = e.touches[0].clientX - touch.x;
      var dy = e.touches[0].clientY - touch.y;
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) clearTimeout(holdTimer);
      if (Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy)) {
        touch = null;
        step(dx < 0 ? 1 : -1);
      }
    });

    stage.addEventListener('touchend', function () {
      clearTimeout(holdTimer);
      if (touch && Date.now() - touch.ms < 350) {
        if ($('panel').classList.contains('open')) $('panel').classList.remove('open');
        else document.body.classList.toggle('no-chrome');
      }
      touch = null;
    });

    document.addEventListener('keydown', function (e) {
      if (e.target.closest('#panel')) {
        if (e.key == 'Escape') $('panel').classList.remove('open');
        return;
      }
      if (e.key == 'ArrowLeft') step(-1);
      else if (e.key == 'ArrowRight') step(1);
      else if (e.key == 'i' || e.key == 'I' || e.key == '?') $('panel').classList.toggle('open');
      else if (e.key == 'Escape') {
        $('panel').classList.remove('open');
        document.body.classList.remove('no-chrome');
      }
      else if (e.key == 'h' || e.key == 'H') document.body.classList.toggle('no-chrome');
      else if (e.key == 'f' || e.key == 'F') {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      }
    });

    // typing a date in the hash jumps to it, browser back/forward works too
    window.addEventListener('hashchange', function () {
      var m = /^#(\d{4}-\d{2}-\d{2})$/.exec(location.hash);
      if (m && m[1] != cur) show(m[1], -1);
    });

    var m = /^#(\d{4}-\d{2}-\d{2})$/.exec(location.hash);
    show(m ? m[1] : today(), -1);
  </script>
</body>

</html>
